  <section class="page-hero page-hero-compact">

      <p class="eyebrow" data-i18n="nav.ourServices">Our Services</p>
      <h1 data-i18n="pg.hybrid.title"></h1>
      <p class="lead" data-i18n="pg.hybrid.sub"></p>
    </div>

  <section class="service-body">

      <div class="service-intro">
        <p data-i18n="pg.hybrid.p1"></p>

        <p data-i18n="pg.turnaroundVal"></p>
